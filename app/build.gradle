plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.zlatylauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.zlatylauncher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // zmenšený a optimalizovaný build; podepsaný debug klíčem, takže jde rovnou nainstalovat
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// žádné závislosti - launcher je záměrně co nejlehčí
